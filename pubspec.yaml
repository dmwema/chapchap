name: chapchap
description: money transfert app

publish_to: 'none'

version: 5.3.5+154

environment:
  sdk: ">=3.0.0 <4.0.0" 

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_lints: ^6.0.0
  translator: ^1.0.4+1
  video_player: ^2.11.1
  dropdown_search: 6.0.2
  open_filex: ^4.7.0
  webview_flutter: ^4.13.1
  flutter_native_splash: ^2.4.7
  world_info_plus: ^1.0.1
  flutter_contacts: ^2.2.0
  shared_preferences: ^2.5.5
  icon_forest: ^1.1.8
  carousel_slider: ^5.1.1
  fluttertoast: ^9.1.0
  http: ^1.5.0
  local_auth: ^3.0.1
  flutter_local_notifications: ^19.5.0
  flashy_flushbar: ^1.4.0
  provider: ^6.1.5+1
  flutter_svg: ^1.0.3
  bottom_navy_bar: ^6.1.0
  circular_profile_avatar: ^2.0.5
  flutter_launcher_icons: ^0.14.4
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1
  flutter_cupernino_bottom_sheet: ^1.0.8
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  google_fonts: ^6.3.2
  page_transition:
    path: packages/page_transition
  path_provider: ^2.1.5
  dio: ^5.9.0
  map_launcher: ^4.5.0
  email_validator: '^2.1.16'
  share_plus: ^13.1.0
  super_cupertino_navigation_bar: ^2.1.2
#  maps_launcher: ^3.0.0+1
  mask_text_input_formatter: ^2.9.0
  sms_autofill: ^2.4.1
  flutter_time_picker_spinner: ^2.0.0
  restart_app: ^1.8.3
  flutter_downloader: ^1.12.0
  image_picker: ^1.2.0
  flutter_cupertino_datetime_picker: ^3.0.0
  flutter_cupertino_date_picker_fork: ^1.0.7
  dbus: ^0.7.11
  xml: ^6.6.1
  pin_code_fields: ^8.0.1
  image: ^4.5.4
  country_icons: ^2.0.0
  in_app_review: ^2.0.12
  confetti: ^0.8.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#00000"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48 # min:48, max:256, default: 48

flutter_native_splash:
  color: "#ee2829"
  image: "assets/logo.png"

dependency_overrides:
  page_transition:
    path: packages/page_transition

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
#  flutter_lints: ^2.0.0

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/videos/
    - assets/icons/
    - lib/l10n/app_fr.json
    - lib/l10n/app_en.json
    - lib/l10n/app_es.json
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
   - family: Roboto
     fonts:
       - asset: fonts/Roboto-Regular.ttf
       - asset: fonts/Roboto-Bold.ttf
         weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

